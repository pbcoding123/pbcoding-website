# 团队社区规则

> Version 2.0.2

> **致谢**：本准则大部分内容基于 @[zengchenyu0356](https://www.luogu.com.cn/user/1701497) 与 @[zhengwenbang](https://www.luogu.com.cn/user/1433239) 的原始法典，并吸纳了团队成员的多项补充建议。本次修订着重整合原有条款、优化梯度处罚、强化新人保护，力求规则清晰、执行公正、氛围友善。

---

## 第一章 总则

### 1.1 制定目的
为维护团队良好秩序，鼓励正向贡献，保障每位成员的合法权益，特制定本准则。

### 1.2 适用范围
本准则适用于团队所有正式成员。新成员在通过第二章所述的新手引导期后，即受全部条款约束。

### 1.3 核心价值观

- 尊重与包容：相互尊重，理性的交流，反对任何形式的歧视与攻击。
- 贡献与分享：鼓励创作、分享与互助，贡献被看见，善意被回报。
- 责任与诚信：珍惜团队资源，诚信参与，勇于承担责任。

### 1.4 核心积分说明

- **积分**：团队虚拟贡献积分，用于衡量活跃度与贡献度，是管理员竞选、晋升的重要参考。初始值：$30$（新人另享保护期）。
- **RP（人品值）**：反映成员在团队内的信任度，初始值：$10$。每日自动增长，同时与积分变动挂钩。

---

## 第二章 新人保护与引导

### 2.1 新人定义
同时满足以下两项条件的成员视为新人：

- 加入团队未满 $14$ 天；
- 累计贡献行为（发帖、出题、参与有效讨论）少于 $5$ 次。

### 2.2 新人专属权利

- 在加入后 $14$ 天内，因不熟悉规则导致的首次轻微违规（如格式错误、重复提问、误操作），仅作友善提醒，不记录警告，不扣除积分或 RP。
- 可自愿向管理员申请匹配一位“导师”志愿者，获得一对一入门指导（导师可获额外贡献奖励）。
- 首次参与团队公开赛或发布干货帖子，额外奖励 $$10$$ 积分（仅一次）。

### 2.3 新手缓冲期

- 新人初始积分为 $30$，且在加入后 $30$ 天内，即使积分降至负值，也不会被移出团队（但严重恶意行为除外）。
- 团队维护公开的《新手快速上手指南》，管理员确保其持续更新。

---

## 第三章 奖励机制

本章列举所有常规贡献途径及其奖励标准。所有奖励均需经管理员审核确认，杜绝虚假或低质贡献。

### 3.1 邀请新成员（拉人）

- 成功邀请一名新成员加入团队（需该成员完成注册并加入），邀请人获得 $20$ 积分。
- 若被邀请人在加入后 $$30$$ 天 内因重度违规（见 4.3、4.6）受到处罚，邀请人将被连带扣除 $30$ 积分和 $2$ RP（如邀请人不知情且可证明已履行指导义务，可向管理员申请减免）。
- **禁止恶意拉人**：指将同一人反复拉入又踢出以骗取奖励。一经发现，首次警告，第二次记警告并扣除 $20$ 积分，第三次扣除 $30$ 积分、取消管理员权限 $7 天、禁言 7$ 天。

### 3.2 创建原创题目

- 题目需包含清晰的题面描述和完整的测试数据（或测试点说明），并向管理员或主管理员通报。
- 奖励依据难度分级（难度由管理员综合评定）：
  - 入门 \~ 普及：$10$ 积分
  - 普及 + \~ 提高 +：$25$ 积分
  - 省选 \~ NOI：$50$ 积分
- 禁止虚标难度以骗取更高奖励。违规后首次退稿并提醒，第二次记警告并扣除 $10$ 积分，第三次扣除 $30$ 积分、禁言 $7$ 天、取消管理员 $7$ 天。
- 题目内容不得含有辱骂、诬陷、色情或攻击性信息，且原创性应占主体（允许合理引用，但须注明来源）。违反此条按严重程度处罚（见 4.3）。

### 3.3 创建团队公开赛

- 认真编写、结构完整、难度适中的比赛（如专题练习、综合测试），经管理员审核通过后发布，奖励 $30$ 积分。
- 若比赛收获 $\ge 5$ 条评价且好评率 $\ge 80\%$，额外奖励 $10$ 积分。
- 若被认定为随意编写（如仅有标题无实质内容），按“滥用资源”处理（见 4.1）。

### 3.4 发布干货帖子

- 发布知识点讲解、解题思路分析、工具使用技巧、经验总结等有益内容，奖励 $30$ 积分。
- 若帖子被管理员加精或获得 $\ge 10$ 个“有用”投票，额外奖励 $15$ 积分。
- 允许借鉴他人思想，但需明确标注参考来源；完全抄袭或内容过于浅显（如“如何做 A + B”）不予奖励，并可能记提醒。

### 3.5 积极帮助他人

- 在回复区有效解答他人问题（被提问者或管理员认可），每次奖励 $5$ 积分。
- 主动整理团队常见问题 FAQ 并提交管理员，经采纳奖励 $20$ 积分。

### 3.6 巨大贡献

- 对团队有长期、重大正面影响的行为（如重构核心工具、主导大型活动、引入优质资源等），由管理员集体评议，给予 $50 \sim 200$ 积分及相应 RP 奖励。

---

## 第四章 违规行为与处罚

本团队遵循“**梯度处理、允许补救**”的原则：首次违规一般予以提醒，第二次记警告，第三次执行正式处罚（扣除积分、禁言、取消管理员等）。严重恶意行为可直接采取相应处罚，但须经至少两名管理员确认。

每位成员的警告记录以**自然月**为单位滚动清零（每月 $1$ 日重置）。

### 4.1 滥用资源（低质量内容）

- **适用行为**：随意编写比赛（无实质内容）、发布明显无价值的帖子（如“如何输出 Hello World”）、创建空白或重复题单等浪费团队资源的行为。
- **处理流程**：
  - 首次：删除内容，私信提醒并给予改进建议。
  - 第二次：删除内容，记警告 1 次。
  - 第三次：扣除 $20$ 积分，取消管理员权限 $3$ 天，禁言 $3$ 天。

> 新人保护期内首次类似行为仅作指导性退稿，不记录警告。

### 4.2 不文明交流（辱骂、人身攻击、恶意引战）

- **适用行为**：在公开频道或私信中对团队成员使用侮辱性语言、歧视性言论、持续骚扰或恶意挑衅。
- **处理流程**：
  - 首次：删除违规内容，私信警告。
  - 第二次：删除内容，记警告 1 次，扣除 $10$ 积分。
  - 第三次：扣除 $30$ 积分，取消管理员权限 $10$ 天，禁言 $5$ 天。
- 情节特别严重（如威胁、恶意曝光隐私等），管理员可直接处罚 $50$ 积分并禁言 $7$ 天，同时报送团队最高负责人。

### 4.3 原创题目内容违规

- **适用行为**：题目中夹带辱骂、诬陷、色情、政治敏感或大量复制他人内容且未注明。
- **处理分级**：
  - **轻度**（如偶现不友好措辞）：禁言 $3$ 天，取消管理员 $3$ 天，扣除 $20$ 积分。
  - **中度**（如多处违规或针对性攻击）：禁言 $7$ 天，取消管理员 $14$ 天，扣除 $50$ 积分。
  - **重度**（如恶意诽谤、传播违法信息）：禁言 $30$ 天，取消管理员资格，积分重置为 $10$，并列入观察名单。可通过提交书面检讨申请提前解禁（需管理员集体同意），或凭重大贡献抵消部分处罚。

### 4.4 越权操作

- **适用行为**：未经管理员同意，擅自更改团队介绍、管理员名单，或私自增减他人积分或 RP。
- **处理流程**：
  - 首次：恢复原状，私信严重警告，扣除 $30$ 积分。
  - 第二次：扣除 $50$ 积分，取消管理员 $7$ 天，禁言 $3$ 天。
  - 第三次：扣除 $100$ 积分，取消管理员资格，禁言 $10$ 天，并考虑进一步处理。
- 若为新人首次因不了解权限范围而误操作，仅作书面警告并指导，不扣积分。

### 4.5 恶意拉人（已在 3.1 中规定，此处重申处罚梯度）

按 3.1 中的梯度执行，不再重复。

### 4.6 严重破坏团队秩序

- **适用行为**：故意散布虚假信息、恶意破坏团队数据、公开泄露团队内部敏感信息、利用漏洞非法获取积分等。
- **处理**：一次性扣除 $100$ 积分，取消管理员资格，禁言 $14$ 天，并记录为严重违规。情节极其恶劣者，经管理员集体表决可移出团队。

---

## 第五章 禁闭与解封机制

**5.1 禁闭含义**\
禁闭期间，成员无法发布任何新内容、创建活动或使用管理员功能，但仍可浏览已有内容、接收消息和私信管理员。

**5.2 解封途径**

- **书面检讨**：被禁闭成员可向管理员提交书面检讨，阐明错误认识与改进计划。管理员在 **24 小时** 内评议，若态度诚恳且情节较轻，可提前解除禁闭（已扣除的积分不予返还）。
- **重大贡献抵免**：禁闭期间若做出被管理员认可的突出贡献（如修复紧急故障、协助关键任务），可抵消部分或全部禁闭时长。

**5.3积分为负的处理**

- 当积分降至负数，成员将暂停发帖和活动权限，但仍可参与讨论（回复）和私信。
- 成员需通过贡献（如帮助他人、整理文档等）将积分恢复至 $\ge0$，权限即自动恢复。
- 若积分为负状态持续超过 $3$ 天，且成员未主动联系管理员说明情况，管理员将发出最后提醒；超过 $7$ 天仍为负，则移出团队。
- **新人保护期**内，积分可降至 $-20$，且上述 $7$ 天期限延长至 $30$ 天。

---

## 第六章 RP（人品）值系统

**6.1 RP 的获得**

- 每日自动增加 $2$ RP（无论是否活跃）。
- 每次因贡献获得积分奖励时，同步增加 $\lfloor\frac{\text{积分}}{2}\rfloor$ 的 RP。
- 巨大贡献经评议可额外获得 RP。

**6.2 RP 的扣除**

- 每次因违规被扣除积分时，同步扣除 $\lfloor\frac{\text{积分}}{5}\rfloor$ 的 RP。
- 仅提醒或警告（未扣积分）不扣除 RP。

**6.3 RP 低于 $0$ 的处理**

- RP 低于 $0$ 的成员将被列入“待关注名单”，此时无法发布新帖、创建比赛或使用管理权限，但可以回复已有帖子及私信管理员。
- 当 RP 通过每日增长或额外奖励恢复至 $\ge0$ 时，权限自动恢复。
- 新人首次出现 RP 为负，管理员将主动联系并提供改进建议，不立即限制权限。

---

## 第七章 管理员与团队治理

**7.1 管理员职责**

- 公正执行本准则，定期审查奖励和处罚记录，确保一致性。
- 每周至少查看一次《新手提问区》，保证新人问题得到及时回应。
- 不得利用权限为自己牟取额外积分（自身奖励需由其他管理员评议）。

**7.2 管理员选拔与晋升**

-积分和 RP 均为竞选重要参考，同时需考察实际贡献、协作态度和责任心。
- 晋升管理员需获得现有管理员 $\frac{2}{3}$ 以上同意，且本人无严重违规记录。

**7.3 规则修订与反馈**

- 任何成员可在规则下方回复区提出修订建议。管理员每 **两个月** 组织一次公开讨论，收集意见并投票决定是否修改。
- 若发现条款有歧义或遗漏，管理员应在 $3$ 个工作日内发布解释说明，并在下一版本中完善。

---

## 第八章 附则

- 本准则自发布之日起生效，此前版本同时废止。
- 所有处罚与奖励记录均以团队内部日志为准，成员可随时向管理员查询自己的积分、RP 及警告次数。
- 本准则解释权归管理员团队，但解释须符合“善意、合理、前后一致”的原则，不得随意扩大处罚范围。
- 对于本准则未明确规定的特殊情况，管理员团队可参照最相似条款的精神集体裁定，并予以公示。
