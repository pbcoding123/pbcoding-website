<!--About-us-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pbcoding的网页</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .fade-in {
            animation: fadeIn 0.8s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen gradient-bg">
    <!-- 导航栏 -->
    <nav class="bg-white bg-opacity-90 backdrop-blur-sm shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center">
                    <i class="fas fa-code text-2xl text-purple-600 mr-3"></i>
                    <h1 class="text-xl font-bold text-gray-800">pbcoding</h1>
                </div>
                <div class="hidden md:flex space-x-8">
                    <a href="https://pbcoding123.dpdns.org" class="text-gray-600 hover:text-purple-600 transition-colors">首页</a>
                    <a href="https://pbcoding123.dpdns.org/links" class="text-gray-600 hover:text-purple-600 transition-colors">快速访问</a>
                    <a href="https://pbcoding123.dpdns.org/about-us" class="text-gray-600 hover:text-purple-600 transition-colors">关于我们</a>
                </div>
                <button class="md:hidden text-gray-600">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="text-center fade-in">
            <div class="bg-gray-200 rounded-2xl p-8 card-hover">
                <i class="fas fa-rocket text-4xl text-purple-600 mb-4"></i>
                <h3 class="text-2xl font-bold text-gray-800 mb-4">关于我们</h3>
                <span>
                	本网页由<span style="font-weight: bold; color: rgb(82, 196, 26);">pbcoding</span>编写
                	<br>
                	<br>
                	本网页已启用Cloudflare
                </span>
                <div class="space py-8"></div>
                <h3 class="text-2xl font-bold text-gray-800 mb-4">联系我们</h3>
                <div class="flex justify-center py-4 px-4" style="border: 1px solid black;">
                	<img src="luogu.png" width="20">
					<span class="px-2"></span>
					<a href="https://www.luogu.com.cn/user/1210725"	style="font-weight: bold; color: rgb(82, 196, 26);">pbcoding</a>
					<span class="px-2"></span>

					<img src="github.png" width="30">
					<span class="px-1"></span>
					<a href="https://github.com/pbcoding123" style="font-weight: bold; color: #1F2328">pbcoding123</a>
                </div>
            </div>
        </div>
    </main>

    <div class="space py-20"></div>

    <footer class="bg-gray-800 text-white">
        <div class="border-t border-gray-700">
            <div class="max-w-7xl mx-auto px-4 py-8">
                <div class="flex flex-col md:flex-row justify-between items-center">
                    <p class="text-gray-400 text-sm mb-4 md:mb-0">
                        &copy; 2025 Pbcoding. 保留所有权利.
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // 简单的交互动画
        document.addEventListener('DOMContentLoaded', function() {
            const yearElement = document.querySelector('footer p');
            if (yearElement) {
                const currentYear = new Date().getFullYear();
                yearElement.innerHTML = yearElement.innerHTML.replace('2025', currentYear);
            }

            const cards = document.querySelectorAll('.card-hover');

            cards.forEach(card => {
                card.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-10px) scale(1.02)';
                });

                card.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0) scale(1)';
                });
            });

            // 添加滚动动画
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };

            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, observerOptions);

            // 观察所有卡片
            cards.forEach(card => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                card.style.transition = 'all 0.6s ease';
                observer.observe(card);
            });
        });
    </script>
</body>
</html>
